{{define "task-card.html"}}<article class="task-card" draggable="true" data-task="{{.ID}}" data-column="{{.ColumnID}}" data-title="{{.Title}}" data-description="{{.Description}}" data-priority="{{.Priority}}" data-labels="{{range .Labels}}{{.ID}} {{end}}" tabindex="0"><div class="task-card-head"><a href="/tasks/{{.ID}}"><strong>{{.Title}}</strong></a><small class="task-priority priority-{{.Priority}}">{{priorityLabel .Priority}}</small></div>{{if .Labels}}<div class="task-labels">{{range .Labels}}<span style="--label-color:{{.Color}}">{{.Name}}</span>{{end}}</div>{{end}}{{if .DueDate}}<footer>Fällig {{due .DueDate}}</footer>{{end}}</article>{{end}}
