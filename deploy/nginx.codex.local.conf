server {
    listen 10.42.149.19:80 default_server;
    server_name codex.local;

    return 301 https://$host$request_uri;
}

server {
    listen 10.42.149.19:443 ssl default_server;
    server_name codex.local;

    ssl_certificate     /etc/nginx/ssl/codex.local.crt;
    ssl_certificate_key /etc/nginx/ssl/codex.local.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = /mcp {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location = /events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/taskboard-sso.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Internal-network convenience SSO. The secret is kept in an
        # untracked, root-readable include and only reaches loopback.
        # For a less trusted network, enable Basic Auth before this bridge:
        # auth_basic "Taskboard";
        # auth_basic_user_file /etc/nginx/taskboard.htpasswd;
        include /etc/nginx/snippets/taskboard-sso.conf;
    }
}
