name: Quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: cd frontend && timeout 120s npm ci && timeout 120s npm run build
      - name: Frontend lint
        run: timeout 120s npm run lint --prefix frontend
      - name: Frontend browser tests
        # The embedded-bundle check needs a running production binary and is
        # covered by the dedicated production-browser job below.  Keep the
        # Vite-backed suite here focused on application behaviour.
        run: timeout 120s npm run test:e2e --prefix frontend -- --grep-invert "production app serves matching build metadata and every fingerprinted asset"
  go:
    name: Go correctness and race detection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Pin the patched Go toolchain
        run: |
          set -euo pipefail
          # shellcheck source=scripts/go-toolchain.sh
          source ./scripts/go-toolchain.sh
          toolchain="$(shipyard_minimum_go_toolchain)"
          echo "GOTOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "TASKBOARD_GO_VERSION=$toolchain" >> "$GITHUB_ENV"
          GOTOOLCHAIN="$toolchain" ./scripts/require-go-toolchain.sh
          ./scripts/go-toolchain-selftest.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build embedded frontend for Go tests
        run: timeout 120s npm ci --prefix frontend && timeout 120s npm run build --prefix frontend
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces. Bubblewrap needs
          # them to create the isolated loopback used by NetworkMode=none.
          if [ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns >/dev/null
          fi
          ./deploy/bubblewrap-healthcheck.sh || printf 'Bubblewrap preflight failed; live isolation tests will skip.\n'
      - name: Vet
        run: timeout 120s go vet ./...
      - name: Unit and integration tests (shuffled)
        run: timeout 120s go test -shuffle=on -count=3 ./...
      - name: Race detector
        run: timeout 120s go test -race ./...

  artifact-vuln:
    name: Patched toolchain and artifact vulnerability gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Pin the patched Go toolchain
        run: |
          set -euo pipefail
          # shellcheck source=scripts/go-toolchain.sh
          source ./scripts/go-toolchain.sh
          toolchain="$(shipyard_minimum_go_toolchain)"
          echo "GOTOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "TASKBOARD_GO_VERSION=$toolchain" >> "$GITHUB_ENV"
          GOTOOLCHAIN="$toolchain" ./scripts/require-go-toolchain.sh
      - name: Build and scan the release artifact
        run: |
          set -euo pipefail
          ./scripts/build-taskboard.sh -o /tmp/shipyard-artifact --scan
          go version -m /tmp/shipyard-artifact

  production-browser:
    name: Embedded production browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Pin the patched Go toolchain
        run: |
          set -euo pipefail
          # shellcheck source=scripts/go-toolchain.sh
          source ./scripts/go-toolchain.sh
          toolchain="$(shipyard_minimum_go_toolchain)"
          echo "GOTOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "TASKBOARD_GO_VERSION=$toolchain" >> "$GITHUB_ENV"
          GOTOOLCHAIN="$toolchain" ./scripts/require-go-toolchain.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build embedded production binary
        run: timeout 120s npm ci --prefix frontend && timeout 120s npm run build --prefix frontend && ./scripts/build-taskboard.sh -o /tmp/taskboard-embedded
      - name: Start embedded production server
        run: TASKBOARD_ADDR=127.0.0.1:8080 /tmp/taskboard-embedded --embedded-app-http > /tmp/taskboard-embedded.log 2>&1 &
      - name: Run browser tests against embedded production server
        # The production server is intentionally exercised by the bundle
        # smoke test only; the remaining specs rely on Vite fixtures/routes.
        run: timeout 120s env TASKBOARD_E2E_BASE_URL=http://127.0.0.1:8080 npm run test:e2e --prefix frontend -- e2e/embedded-bundle.spec.ts
