name: Quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go correctness and race detection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Vet
        run: go vet ./...
      - name: Unit and integration tests (shuffled)
        run: go test -shuffle=on -count=3 ./...
      - name: Race detector
        run: go test -race ./...
