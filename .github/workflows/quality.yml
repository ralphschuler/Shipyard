name: Quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: cd frontend && npm ci && npm run build
      - name: Frontend lint
        run: cd frontend && npm run lint
  go:
    name: Go correctness and race detection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Vet
        run: go vet ./...
      - name: Unit and integration tests (shuffled)
        run: go test -shuffle=on -count=3 ./...
      - name: Race detector
        run: go test -race ./...
