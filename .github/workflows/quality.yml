name: Quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: cd frontend && timeout 120s npm ci && timeout 120s npm run build
      - name: Frontend lint
        run: timeout 120s npm run lint --prefix frontend
      - name: Frontend browser tests
        # The embedded-bundle check needs a running production binary and is
        # covered by the dedicated production-browser job below.  Keep the
        # Vite-backed suite here focused on application behaviour.
        run: timeout 120s npm run test:e2e --prefix frontend -- --grep-invert "production app serves matching build metadata and every fingerprinted asset"
  go:
    name: Go correctness and race detection
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # This is a disposable service-local database. Never fall back to
      # DATABASE_URL, which may point at an operator or production database.
      SHIPYARD_TEST_DATABASE_URL: postgres://taskboard:taskboard@127.0.0.1:5432/taskboard_ci?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskboard
          POSTGRES_PASSWORD: taskboard
          POSTGRES_DB: taskboard_ci
        options: >-
          --health-cmd "pg_isready -U taskboard -d taskboard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build embedded frontend for Go tests
        run: timeout 120s npm ci --prefix frontend && timeout 120s npm run build --prefix frontend
      - name: Vet
        run: timeout 120s go vet ./...
      - name: Verify isolated PostgreSQL integration configuration
        run: timeout 120s test -n "$SHIPYARD_TEST_DATABASE_URL"
      - name: PostgreSQL integration tests
        run: timeout 120s go test -v -shuffle=on -count=3 ./internal/store ./internal/automation
      - name: Unit and integration tests (shuffled)
        run: timeout 120s go test -shuffle=on -count=3 ./...
      - name: Race detector
        run: timeout 120s go test -race ./...

  production-browser:
    name: Embedded production browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build embedded production binary
        run: timeout 120s npm ci --prefix frontend && timeout 120s npm run build --prefix frontend && timeout 120s go build -o /tmp/taskboard-embedded ./cmd/taskboard
      - name: Start embedded production server
        run: TASKBOARD_ADDR=127.0.0.1:8080 /tmp/taskboard-embedded --embedded-app-http > /tmp/taskboard-embedded.log 2>&1 &
      - name: Run browser tests against embedded production server
        # The production server is intentionally exercised by the bundle
        # smoke test only; the remaining specs rely on Vite fixtures/routes.
        run: timeout 120s env TASKBOARD_E2E_BASE_URL=http://127.0.0.1:8080 npm run test:e2e --prefix frontend -- e2e/embedded-bundle.spec.ts
