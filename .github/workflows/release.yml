name: Release

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules use UTC: every Friday at 09:00 UTC.
    - cron: "0 9 * * 5"

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  # The monotonically increasing workflow run number gives every merge a
  # unique semver patch release and is stable across workflow retries.
  RELEASE_VERSION: v0.1.${{ github.run_number }}

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Pin the patched Go toolchain
        run: |
          set -euo pipefail
          # shellcheck source=scripts/go-toolchain.sh
          source ./scripts/go-toolchain.sh
          toolchain="$(shipyard_minimum_go_toolchain)"
          echo "GOTOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "TASKBOARD_GO_VERSION=$toolchain" >> "$GITHUB_ENV"
          GOTOOLCHAIN="$toolchain" ./scripts/require-go-toolchain.sh
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build embedded frontend
        env:
          TASKBOARD_VERSION: ${{ env.RELEASE_VERSION }}
          TASKBOARD_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd frontend
          timeout 120s npm ci
          timeout 120s npm run build
      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TASKBOARD_VERSION: ${{ env.RELEASE_VERSION }}
          TASKBOARD_COMMIT_SHA: ${{ github.sha }}
          TASKBOARD_LDFLAGS_EXTRA: "-s -w"
        run: |
          set -euo pipefail
          mkdir -p dist
          ./scripts/build-taskboard.sh -o "dist/shipyard-${GOOS}-${GOARCH}" --scan
          go version -m "dist/shipyard-${GOOS}-${GOARCH}"
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: shipyard-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/shipyard-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum dist/shipyard-* > dist/SHA256SUMS
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_VERSION" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target master \
              --title "Shipyard $RELEASE_VERSION" \
              --generate-notes
          fi
