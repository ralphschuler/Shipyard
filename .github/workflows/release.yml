name: Release

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules use UTC: every Friday at 09:00 UTC.
    - cron: "0 9 * * 5"

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  # The monotonically increasing workflow run number gives every merge a
  # unique semver patch release and is stable across workflow retries.
  RELEASE_VERSION: v0.1.${{ github.run_number }}
  # Pin every artifact and the published tag to the commit this run checked
  # out. github.sha is immutable for the run; a later merge of master cannot
  # retarget the tag the way --target master would.
  RELEASE_COMMIT: ${{ github.sha }}
  RELEASE_APPROVED_REF: refs/heads/master
  RELEASE_APPROVED_BRANCH: master

jobs:
  gate:
    name: Verify release eligibility
    runs-on: ubuntu-24.04
    steps:
      - name: Reject unapproved refs
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "$RELEASE_APPROVED_REF" ]]; then
            printf 'ref %s is not the approved release ref %s\n' "$GITHUB_REF" "$RELEASE_APPROVED_REF" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            printf 'RELEASE_COMMIT is not a full SHA-1: %s\n' "$RELEASE_COMMIT" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: gate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Check out built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build embedded frontend
        env:
          TASKBOARD_VERSION: ${{ env.RELEASE_VERSION }}
          TASKBOARD_COMMIT_SHA: ${{ env.RELEASE_COMMIT }}
        run: |
          set -euo pipefail
          cd frontend
          timeout 120s npm ci
          timeout 120s npm run build
      - name: Build release binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p dist
          timeout 120s go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_VERSION} -X main.commit=${RELEASE_COMMIT} -X main.builtAt=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/shipyard-${GOOS}-${GOARCH}" ./cmd/taskboard
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: shipyard-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/shipyard-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 1
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Bind tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum dist/shipyard-* > dist/SHA256SUMS
          ./scripts/publish-github-release.sh
