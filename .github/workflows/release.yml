name: Release

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules use UTC: every Friday at 09:00 UTC.
    - cron: "0 9 * * 5"

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  # The monotonically increasing workflow run number gives every merge a
  # unique semver patch release and is stable across workflow retries.
  RELEASE_VERSION: v0.1.${{ github.run_number }}
  # Pin every artifact and the published tag to the commit this run checked
  # out. github.sha is immutable for the run; a later merge of the approved
  # branch cannot retarget the tag.
  RELEASE_COMMIT: ${{ github.sha }}
  RELEASE_APPROVED_REF: refs/heads/master
  RELEASE_APPROVED_BRANCH: master

jobs:
  gate:
    name: Verify release eligibility
    runs-on: ubuntu-24.04
    steps:
      - name: Reject unapproved refs
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "$RELEASE_APPROVED_REF" ]]; then
            printf 'ref %s is not the approved release ref %s\n' "$GITHUB_REF" "$RELEASE_APPROVED_REF" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            printf 'RELEASE_COMMIT is not a full SHA-1: %s\n' "$RELEASE_COMMIT" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: gate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Check out built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Pin the patched Go toolchain
        run: |
          set -euo pipefail
          # shellcheck source=scripts/go-toolchain.sh
          source ./scripts/go-toolchain.sh
          toolchain="$(shipyard_minimum_go_toolchain)"
          echo "GOTOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "TASKBOARD_GO_VERSION=$toolchain" >> "$GITHUB_ENV"
          GOTOOLCHAIN="$toolchain" ./scripts/require-go-toolchain.sh
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and scan release artifact
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TASKBOARD_VERSION: ${{ env.RELEASE_VERSION }}
          TASKBOARD_COMMIT_SHA: ${{ env.RELEASE_COMMIT }}
          TASKBOARD_LDFLAGS_EXTRA: "-s -w"
        run: |
          set -euo pipefail
          mkdir -p dist
          ./scripts/build-release-artifact.sh -o "dist/shipyard-${GOOS}-${GOARCH}" --scan
          go version -m "dist/shipyard-${GOOS}-${GOARCH}"
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: shipyard-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/shipyard-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  image:
    name: Publish agent base image
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve floating minor tag
        id: image
        run: echo "minor=${RELEASE_VERSION%.*}" >> "$GITHUB_OUTPUT"
      - name: Build and push agent base image
        uses: docker/build-push-action@v6
        with:
          context: deploy/agent-base
          file: deploy/agent-base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/ralphschuler/shipyard-agent-base:${{ env.RELEASE_VERSION }}
            ghcr.io/ralphschuler/shipyard-agent-base:${{ steps.image.outputs.minor }}
            ghcr.io/ralphschuler/shipyard-agent-base:latest
      - name: Make the package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Agent hosts pull this image without a registry login. A package
          # published by GITHUB_TOKEN starts private until visibility is set.
          for attempt in 1 2 3 4 5; do
            if gh api --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/shipyard-agent-base/visibility" \
              -f visibility=public; then
              exit 0
            fi
            sleep "$attempt"
          done
          echo "could not make ghcr.io/${GITHUB_REPOSITORY_OWNER}/shipyard-agent-base public" >&2
          exit 1

  publish:
    name: Publish GitHub release
    needs: [build, image]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 1
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Bind tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum dist/shipyard-* > dist/SHA256SUMS
          ./scripts/publish-github-release.sh
