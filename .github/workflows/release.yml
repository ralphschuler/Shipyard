name: Release

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules use UTC: every Friday at 09:00 UTC.
    - cron: "0 9 * * 5"

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  # The monotonically increasing workflow run number gives every merge a
  # unique semver patch release and is stable across workflow retries.
  RELEASE_VERSION: v0.1.${{ github.run_number }}
  # Pin every artifact and the published tag to the commit this run checked
  # out. github.sha is immutable for the run; a later merge of the approved
  # branch cannot retarget the tag.
  RELEASE_COMMIT: ${{ github.sha }}
  RELEASE_APPROVED_REF: refs/heads/master
  RELEASE_APPROVED_BRANCH: master

jobs:
  gate:
    name: Verify release eligibility
    runs-on: ubuntu-24.04
    steps:
      - name: Reject unapproved refs
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "$RELEASE_APPROVED_REF" ]]; then
            printf 'ref %s is not the approved release ref %s\n' "$GITHUB_REF" "$RELEASE_APPROVED_REF" >&2
            exit 1
          fi
          if [[ ! "$RELEASE_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            printf 'RELEASE_COMMIT is not a full SHA-1: %s\n' "$RELEASE_COMMIT" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: gate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Check out built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: false
      - name: Pin the patched Go toolchain
        run: |
          set -euo pipefail
          # shellcheck source=scripts/go-toolchain.sh
          source ./scripts/go-toolchain.sh
          toolchain="$(shipyard_minimum_go_toolchain)"
          echo "GOTOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          echo "TASKBOARD_GO_VERSION=$toolchain" >> "$GITHUB_ENV"
          GOTOOLCHAIN="$toolchain" ./scripts/require-go-toolchain.sh
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and scan release artifact
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TASKBOARD_VERSION: ${{ env.RELEASE_VERSION }}
          TASKBOARD_COMMIT_SHA: ${{ env.RELEASE_COMMIT }}
          TASKBOARD_LDFLAGS_EXTRA: "-s -w"
        run: |
          set -euo pipefail
          mkdir -p dist
          ./scripts/build-release-artifact.sh -o "dist/shipyard-${GOOS}-${GOARCH}" --scan
          go version -m "dist/shipyard-${GOOS}-${GOARCH}"
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: shipyard-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/shipyard-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  # Native runners build each platform at the same time. One buildx job
  # would emulate arm64 with QEMU and publish both platforms in series.
  image:
    name: Build agent base ${{ matrix.platform }}
    needs: gate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    steps:
      - name: Check out built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push agent base image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: deploy/agent-base
          file: deploy/agent-base/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: "type=image,name=ghcr.io/ralphschuler/shipyard-agent-base,push-by-digest=true,name-canonical=true,push=true"
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'build did not return a platform digest: %s\n' "$DIGEST" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/digests"
          printf '%s\n' "$DIGEST" > "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: agent-base-digest-${{ matrix.artifact }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    name: Publish agent base manifest
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 1
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: agent-base-digest-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve floating minor tag
        id: image
        run: echo "minor=${RELEASE_VERSION%.*}" >> "$GITHUB_OUTPUT"
      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          shopt -s nullglob
          digests=(*)
          if (( ${#digests[@]} != 2 )); then
            printf 'expected 2 platform digests, found %s\n' "${#digests[@]}" >&2
            exit 1
          fi
          args=()
          for digest in "${digests[@]}"; do
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              printf 'unexpected digest file: %s\n' "$digest" >&2
              exit 1
            fi
            args+=("ghcr.io/ralphschuler/shipyard-agent-base@sha256:${digest}")
          done
          docker buildx imagetools create \
            -t "ghcr.io/ralphschuler/shipyard-agent-base:${{ env.RELEASE_VERSION }}" \
            -t "ghcr.io/ralphschuler/shipyard-agent-base:${{ steps.image.outputs.minor }}" \
            -t "ghcr.io/ralphschuler/shipyard-agent-base:latest" \
            "${args[@]}"
      - name: Verify multi-arch tags
        run: |
          set -euo pipefail
          image=ghcr.io/ralphschuler/shipyard-agent-base
          for tag in \
            "${image}:${{ env.RELEASE_VERSION }}" \
            "${image}:${{ steps.image.outputs.minor }}" \
            "${image}:latest"
          do
            report="$(docker buildx imagetools inspect "$tag")"
            printf '%s\n' "$report"
            for platform in linux/amd64 linux/arm64; do
              if ! grep -Fq "$platform" <<<"$report"; then
                printf 'tag %s is missing %s\n' "$tag" "$platform" >&2
                exit 1
              fi
            done
          done
      - name: Make the package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-agent-base-visibility.sh

  publish:
    name: Publish GitHub release
    needs: [build, image-manifest]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 1
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          # Image jobs upload digest artifacts into the same run. Only the
          # release binaries belong on the GitHub release.
          path: dist
          pattern: shipyard-*
          merge-multiple: true
      - name: Bind tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum dist/shipyard-* > dist/SHA256SUMS
          ./scripts/publish-github-release.sh
